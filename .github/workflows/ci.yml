# Checks that must pass before a pull request can be merged.
#
# To make them required: Settings → Branches (or Rules → Rulesets) → add a rule
# for `dev` (and `main`) → "Require status checks to pass" → select "PHP checks".

name: CI

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

# A new push to a PR cancels the older, still-running check for that PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # Fails if composer.json is malformed or composer.lock is out of sync with it.
      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Same install command as the deploy workflow, so we test what gets shipped.
      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Check dependencies for known vulnerabilities
        run: composer audit --no-dev

      - name: PHP syntax check
        run: |
          git ls-files -z '*.php' | xargs -0 -n1 php -l

      # Starts PHP's built-in server and calls auth.php the way the site does.
      # Proves the autoloader and google/apiclient load, and that bad requests
      # are rejected with the right status codes.
      - name: Smoke test auth.php
        run: |
          php -S 127.0.0.1:8000 > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8000/ && break; sleep 0.5; done

          expect() {
            local want="$1" body="$2" got
            got=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8000/auth.php)
            echo "POST $body -> $got $(cat /tmp/resp.json)"
            if [ "$got" != "$want" ]; then
              echo "::error::auth.php returned $got, expected $want"
              cat /tmp/php-server.log
              exit 1
            fi
          }

          expect 400 '{}'
          expect 401 '{"token":"not-a-real-token"}'
