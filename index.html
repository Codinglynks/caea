<!doctype html>
<html class="no-js" lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAEA</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Résultats du CAEA – École Alsacienne">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#1f3a5f">


  <script src="https://accounts.google.com/gsi/client" async></script>
  <script type="module">
import Shake from 'https://cdn.jsdelivr.net/npm/@shakebugs/browser@latest/+esm'
window.Shake = Shake;
</script>
</head>

<body>

<header>
  <div class="header-inner">
    <img src="img/logo_ea.png" alt="Logo de l'École Alsacienne">
    <div>
      <div class="brand">CAEA</div>
      <div class="sub">École Alsacienne</div>
    </div>
  </div>
</header>

<main>
  <section class="card">

    <!-- Step 1: sign in -->
    <div id="view-signin">
      <h1>Bienvenue sur le site du CAEA</h1>
      <p class="lead">Connectez-vous avec votre compte de l'école pour consulter vos résultats.</p>
      <div class="signin-wrap">
        <div
          class="g_id_signin"
          data-type="standard"
          data-theme="outline"
          data-size="large"
          data-text="signin_with"
          data-shape="pill"
          data-locale="fr"
        ></div>
      </div>
    </div>

    <!-- Step 2: waiting for auth.php -->
    <div id="view-loading" class="hidden">
      <div class="loading">
        <div class="spinner" aria-hidden="true"></div>
        <div>Vérification en cours…</div>
      </div>
    </div>

    <!-- Step 3: server response -->
    <div id="view-result" class="hidden">
      <div id="result-box" class="result" role="status" aria-live="polite"></div>
      <div class="actions">
        <button id="btn-retry" class="btn primary hidden" type="button">Réessayer</button>
        <button id="btn-signout" class="btn" type="button">Se déconnecter</button>
      </div>
    </div>

  </section>
</main>

<footer>© CAEA – École Alsacienne</footer>

<div
  id="g_id_onload"
  data-auto_prompt="false"
  data-callback="handleCredentialResponse"
  data-client_id="196751137283-vg0urefv51ntaokjckck5qjki6lk966d.apps.googleusercontent.com"
  data-use_fedcm_for_button="true"
  data-button_auto_select="true"
  data-itp_support="true"
  data-auto_select="true"
></div>

<button id="help" class="btn" type="button" onclick="Shake.show();">Aide</button>

<script src="js/app.js"></script>
<script>
  const views = {
    signin: document.getElementById('view-signin'),
    loading: document.getElementById('view-loading'),
    result: document.getElementById('view-result')
  };
  const resultBox = document.getElementById('result-box');
  const btnRetry = document.getElementById('btn-retry');
  const btnSignout = document.getElementById('btn-signout');

  let lastToken = null;

  function show(name) {
    for (const key in views) {
      views[key].classList.toggle('hidden', key !== name);
    }
  }

  // Builds a DOM element with text content (never innerHTML with server data)
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function row(label, valueNode) {
    const r = el('div', 'row');
    r.appendChild(el('span', 'label', label));
    r.appendChild(valueNode);
    return r;
  }

  function renderResult(kind, title, message, details) {
    resultBox.className = 'result ' + kind;
    resultBox.replaceChildren(el('div', 'title', title));
    if (message) resultBox.appendChild(el('div', '', message));

    if (details && details.email) {
      resultBox.appendChild(row('Compte', el('span', '', details.email)));
    }

    if (details && details.website) {
      let valueNode;
      // Only make a link if it's a real http(s) URL
      if (/^https?:\/\//i.test(details.website)) {
        valueNode = el('a', '', details.website);
        valueNode.href = details.website;
        valueNode.target = '_blank';
        valueNode.rel = 'noopener noreferrer';
      } else {
        valueNode = el('span', '', details.website);
      }
      resultBox.appendChild(row('Site web', valueNode));
    }

    // Retry makes sense for network / server errors only
    btnRetry.classList.toggle('hidden', kind !== 'err' || !lastToken);
    show('result');
  }

  async function sendToken(token) {
    show('loading');

    let res;
    try {
      res = await fetch('auth.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
      });
    } catch (error) {
      console.error('Fetch error:', error);
      renderResult('err', 'Connexion impossible',
        'Le serveur ne répond pas. Vérifiez votre connexion internet puis réessayez.');
      return;
    }

    // auth.php normally answers JSON, but may return an empty body on a crash
    let data = {};
    try {
      data = await res.json();
    } catch (e) {
      data = {};
    }

    if (res.ok && data.status === 'success') {
      lastToken = null;
      renderResult('ok', 'Connexion réussie', null, data);
      return;
    }

    switch (res.status) {
      case 400:
      case 401:
        lastToken = null; // same token would fail again
        renderResult('err', 'Session invalide',
          'Votre connexion Google n\'a pas pu être vérifiée. Veuillez vous reconnecter.');
        break;
      case 403:
        renderResult('warn', 'Accès refusé',
          'Veuillez utiliser votre adresse @ecole-alsacienne.org.', data);
        break;
      case 404:
        renderResult('warn', 'Aucun résultat',
          'Aucune information n\'a été trouvée pour ce compte.', data);
        break;
      default:
        renderResult('err', 'Erreur du serveur',
          data.error || ('Une erreur inattendue est survenue (code ' + res.status + ').'));
    }
  }

  // Called by Google Identity Services after sign-in
  function handleCredentialResponse(response) {
    lastToken = response.credential;
    sendToken(lastToken);
  }

  btnRetry.addEventListener('click', function () {
    if (lastToken) sendToken(lastToken);
  });

  btnSignout.addEventListener('click', function () {
    lastToken = null;
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.disableAutoSelect();
    }
    show('signin');
  });
</script>

<script type="module">
window.Shake.start('BCbayASvNODiJTmOGqQjs23RUnVl4bvQDlFFFrwMs6hrpXAo3PHcLFq');
Shake.config.floatingButtonEnabled = false;
</script>
</body>

</html>
