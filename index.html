<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAEA</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script>
    async function handleCredentialResponse(response) {
      const token = response.credential;
      console.log("Encoded JWT ID token: " + token);

      try {
        const res = await fetch('auth.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token: token })
        });

        if (!res.ok) {
          throw new Error(`${res.status}`);
        }

        // Use res.text() if auth.php echoes plain text/HTML
        const responseData = await res.text();
        console.log("Response from auth.php:", responseData);
        await printResult("Vous avez eu " + responseData + "points", "green");

      } catch (error) {
        console.error("Fetch error:", error);
        console.log("Erreur du serveur: ", error);
        await printResult("Erreur du serveur: " + error, "red");
      }
    }
  </script>
  
</head>

<body>

<!-- Add your site or application content here -->
<h1>Ceci est le site web du CAEA !!</h1>
<img src="img/logo_ea.png" alt="Logo de l'école alsacienne" width="200">
<script src="js/app.js"></script>
<div
  id="g_id_onload"
  data-auto_prompt="false"
  data-callback="handleCredentialResponse"
  data-client_id="196751137283-vg0urefv51ntaokjckck5qjki6lk966d.apps.googleusercontent.com"
  data-use_fedcm_for_button="true"

  data-button_auto_select="true"
  data-itp_support="true"
  data-auto_select="true"
></div>
<div class="g_id_signin" id="google"></div>
<p id="resultat"><p>
  <button id=lgt onclick="logout()" hidden="hidden">Logout</button>
<script>
  async function printResult(result,color) {
    console.log(result);
    const el = document.getElementById('resultat');
    el.textContent = result;
    el.style.color = color;
    const bt = document.getElementById('google');
    bt.hidden = true;
    const lgt = document.getElementById('lgt');
    lgt.hidden = false;
  }
</script>
  <script>
    async function logout() {
      const el = document.getElementById('resultat');
      el.textContent = null;
      el.hidden = true;
      const bt = document.getElementById('google');
      bt.hidden = false;
      const lgt = document.getElementById('lgt');
      lgt.hidden = true;
      location.reload();
    }
  </script>
<button id="nothing" onclick="handleCredentialResponse({credential: 'test'})">Nothing</button>
<button id="something" onclick="printResult('test')">Something</button>


</body>

</html>
